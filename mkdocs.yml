site_name: Le carnet de notes de Ramzi ☝️🤓
repo_name: buchtioof/notebook
repo_url: https://github.com/buchtioof/notebook

theme:
  logo: assets/logo.svg
  features:
    - navigation.instant
    - navigation.tabs
  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

extra_css:
  - stylesheets/index.css
  - stylesheets/aurora.css

extra_javascript:
  - javascripts/aurora.js
  - javascripts/hello.js

nav:
  - Accueil: index.md
  - Notes:
    - 🧰 SysAdmin:
      - learn/sysadmin/2026-03-04.md
      - 🐧 Linux:
        - learn/sysadmin/linux/2025-10-30.md
        - learn/sysadmin/linux/2025-10-31.md
      - 📚 Bases du Bash:
        - learn/sysadmin/bash/2025-11-27.md
        - learn/sysadmin/bash/2025-11-28.md
      - learn/sysadmin/2026-02-25.md
    - 🔌 DevOps:
      - learn/devops/2026-03-04.md
      - learn/devops/2025-11-28.md
      - learn/devops/2025-12-12.md
      - learn/devops/2026-01-22.md
      - learn/devops/2026-03-18.md
    - ☕ Javascript:
      - learn/javascript/2026-01-30.md
      - learn/javascript/2026-02-06.md
      - learn/javascript/2026-02-09.md
    - 🐍 Python :
      - learn/python/2026-01-16.md
      - learn/python/2026-02-16.md
    - 🐘 PHP :
      - learn/php/2026-04-17.md
    - 🎨 Frontend :
      - learn/frontend/2026-02-21.md
  - Projets:
    - Stage (Mr Box Tea):
      - projects/stage/main.md
      - projects/stage/2026-03-03.md
      - projects/stage/2026-03-09.md
    - projects/2025-12-05.md
    - projects/2026-01-23.md
    - projects/2026-02-13.md
    - projects/2026-11-10.md
  
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji

plugins:
  - search:
      enabled: false



